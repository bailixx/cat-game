<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猫真棒 - 终极完整版</title>
    <style>
        /* 页面基础样式 */
        body { margin: 0; overflow: hidden; background-color: #f5f0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 3D 场景容器 */
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 左上角：摄像头调试窗口 */
        #debug-container {
            position: absolute; top: 20px; left: 20px; width: 240px; height: 180px; z-index: 100;
            background: #000; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transform: scaleX(-1); }
        #output_canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
        #debug-text { position: absolute; bottom: 5px; left: 10px; color: #0f0; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000; }

        /* 中央：状态提示大字 */
        #status-message {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            font-size: 32px; font-weight: 800; color: #444; background: rgba(255,255,255,0.95);
            padding: 20px 50px; border-radius: 50px; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        .sub-text { font-size: 16px; color: #666; font-weight: normal; margin-top: 8px; }
        /* 奖励模式下的粉色跳动效果 */
        .reward-mode { color: #E91E63 !important; border: 4px solid #E91E63; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* 底部：按钮栏 */
        #ui-controls {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 25px; z-index: 50;
        }
        .game-btn {
            padding: 18px 36px; font-size: 20px; font-weight: bold; border: none; border-radius: 18px;
            color: white; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px;
        }
        .game-btn:active { transform: translateY(8px); box-shadow: none; }
        .game-btn:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.8); transform: translateY(8px); box-shadow: none;}
        #btn-carrot { background: linear-gradient(to bottom, #ff8a65, #ff5722); }
        #btn-glasses { background: linear-gradient(to bottom, #555, #222); }
        #btn-bottle { background: linear-gradient(to bottom, #42a5f5, #1565c0); }

    </style>
</head>
<body>

<div id="status-message">
    系统启动中...
    <span class="sub-text">正在加载 AI 与 3D 场景</span>
</div>

<div id="debug-container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="debug-text">AI 视觉: 等待启动...</div>
</div>

<div id="container"></div>

<div id="ui-controls">
    <button id="btn-carrot" class="game-btn">🥕 胡萝卜</button>
    <button id="btn-glasses" class="game-btn">🕶️ 眼镜</button>
    <button id="btn-bottle" class="game-btn">💧 瓶子</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
    // ================= 全局变量 =================
    let scene, camera, renderer;
    let catGroup; // 猫咪整体
    let itemCarrot, itemGlasses, itemBottle; // 三个物品组
    let isWaitingForReward = false; // 状态锁
    
    const statusMsg = document.getElementById('status-message');
    const debugText = document.getElementById('debug-text');
    const buttons = document.querySelectorAll('.game-btn');

    // 辅助函数：让一个组里的所有物体都能产生和接收阴影
    function enableShadows(group) {
        group.traverse((child) => {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
            }
        });
    }

    // ================= 1. 初始化 3D 场景 =================
    function initThreeJS() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f0e0); // 暖米色背景

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 7); // 稍微调高视角
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和阴影
        document.getElementById('container').appendChild(renderer.domElement);

        // --- 灯光系统 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
        mainLight.position.set(5, 10, 8);
        mainLight.castShadow = true;
        // 优化阴影范围
        mainLight.shadow.camera.left = -10; mainLight.shadow.camera.right = 10;
        mainLight.shadow.camera.top = 10; mainLight.shadow.camera.bottom = -10;
        mainLight.shadow.mapSize.width = 2048; mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        // --- 地板 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 20), 
            new THREE.ShadowMaterial({ opacity: 0.15 }) // 仅显示阴影的材质
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 创建核心元素 ---
        createCatSprite();
        createProceduralItems(); // ✨ 这里是新的物品生成函数

        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            // 让物品缓慢自转展示
            if(itemCarrot) itemCarrot.rotation.y += 0.005;
            if(itemGlasses) itemGlasses.rotation.y -= 0.005;
            if(itemBottle) itemBottle.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ================= 2. 创建猫咪 (纸片人) =================
    function createCatSprite() {
        catGroup = new THREE.Group();
        scene.add(catGroup);

        const loader = new THREE.TextureLoader();
        loader.load(
            './mycat.png', 
            (texture) => {
                console.log("✅ 猫咪图片加载成功");
                // 根据图片比例调整大小，这里假设是竖图
                const geometry = new THREE.PlaneGeometry(2.5, 3);
                // 使用 MeshLambertMaterial 让纸片也能受光变暗
                const material = new THREE.MeshLambertMaterial({ 
                    map: texture, transparent: true, side: THREE.DoubleSide, alphaTest: 0.5
                });
                const catSprite = new THREE.Mesh(geometry, material);
                catSprite.position.y = 1.5; // 站立位置
                catSprite.castShadow = true; // 纸片也能投射阴影
                catGroup.add(catSprite);
            },
            undefined,
            () => {
                console.error("❌ 未找到 mycat.png");
                statusMsg.innerHTML = "⚠️ 缺少图片: mycat.png<br><span class='sub-text'>请确保图片在目录中并使用Live Server运行</span>";
                // 用一个红色替身防止崩溃
                const dummy = new THREE.Mesh(new THREE.BoxGeometry(1,2,0.1), new THREE.MeshBasicMaterial({color:0xff0000}));
                dummy.position.y = 1;
                catGroup.add(dummy);
            }
        );
    }

    // ================= 3. ✨用代码“捏”出物品✨ =================
    function createProceduralItems() {
        
        // --- 🥕 胡萝卜 (Carrot) ---
        itemCarrot = new THREE.Group();
        // 身体：上细下粗的圆柱体
        const carrotBodyGeo = new THREE.CylinderGeometry(0.05, 0.3, 1.2, 16);
        const carrotMat = new THREE.MeshLambertMaterial({ color: 0xff6b35 }); // 橙色
        const carrotBody = new THREE.Mesh(carrotBodyGeo, carrotMat);
        carrotBody.position.y = 0.6;
        itemCarrot.add(carrotBody);
        // 叶子：几个绿色的小圆锥
        const leafGeo = new THREE.ConeGeometry(0.08, 0.4, 8);
        const leafMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 }); // 绿色
        for(let i=0; i<3; i++) {
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 1.2;
            // 让叶子散开一点
            leaf.rotation.x = (Math.random() - 0.5) * 0.5;
            leaf.rotation.z = (Math.random() - 0.5) * 0.5;
            itemCarrot.add(leaf);
        }
        itemCarrot.position.set(-2.5, 0, 2.5);
        enableShadows(itemCarrot);
        scene.add(itemCarrot);

        // --- 🕶️ 眼镜 (Glasses) ---
        itemGlasses = new THREE.Group();
        const glassMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 100 }); // 黑色光泽
        // 镜框：使用圆环几何体 (Torus)
        const rimGeo = new THREE.TorusGeometry(0.25, 0.04, 16, 32);
        const leftRim = new THREE.Mesh(rimGeo, glassMat);
        leftRim.position.x = -0.35;
        const rightRim = new THREE.Mesh(rimGeo, glassMat);
        rightRim.position.x = 0.35;
        // 鼻梁架
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.04, 0.04), glassMat);
        // 镜腿
        const armGeo = new THREE.BoxGeometry(0.04, 0.04, 0.6);
        const leftArm = new THREE.Mesh(armGeo, glassMat);
        leftArm.position.set(-0.6, 0, -0.3);
        const rightArm = new THREE.Mesh(armGeo, glassMat);
        rightArm.position.set(0.6, 0, -0.3);
        
        itemGlasses.add(leftRim, rightRim, bridge, leftArm, rightArm);
        itemGlasses.position.set(0, 0.3, 2.5); // 眼镜矮一点
        enableShadows(itemGlasses);
        scene.add(itemGlasses);

        // --- 💧 瓶子 (Bottle) ---
        itemBottle = new THREE.Group();
        // 使用 Phong 材质做一点半透明和高光效果
        const bottleMat = new THREE.MeshPhongMaterial({ color: 0x2196F3, transparent: true, opacity: 0.7, shininess: 80 });
        // 瓶身
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.8, 24), bottleMat);
        body.position.y = 0.4;
        // 瓶颈
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.3, 0.2, 24), bottleMat);
        neck.position.y = 0.9;
        // 瓶盖 (红色)
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.1, 24), new THREE.MeshLambertMaterial({color: 0xD32F2F}));
        cap.position.y = 1.05;
        
        itemBottle.add(body, neck, cap);
        itemBottle.position.set(2.5, 0, 2.5);
        enableShadows(itemBottle);
        scene.add(itemBottle);
    }

    // ================= 4. 交互逻辑 (点击按钮) =================
    function handleSelection(itemType) {
        if(isWaitingForReward) return;
        buttons.forEach(b => b.disabled = true); // 锁定按钮
        
        let targetGroup;
        let text = "";
        if(itemType === 'carrot') { targetGroup = itemCarrot; text = "胡萝卜"; }
        if(itemType === 'glasses') { targetGroup = itemGlasses; text = "眼镜"; }
        if(itemType === 'bottle') { targetGroup = itemBottle; text = "瓶子"; }

        statusMsg.innerHTML = `小猫正在确认 ${text}...`;
        statusMsg.classList.remove('reward-mode');

        const tl = gsap.timeline();
        // 1. 猫咪倾斜身体去“看”目标
        const targetX = targetGroup.position.x;
        tl.to(catGroup.rotation, { z: targetX * -0.08, x: 0.15, duration: 0.5, ease: "power2.out" })
          .to(catGroup.position, { z: 1, duration: 0.5, ease: "power2.out" }, "<")
          
          // 2. 目标物品跳动反馈 (Visual Feedback)
          .to(targetGroup.position, { y: targetGroup.position.y + 0.5, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.out" }, "-=0.2")
          .to(targetGroup.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.3, yoyo: true, repeat: 1 }, "<")

          // 3. 成功提示，开启摄像头监听
          .call(() => {
              statusMsg.innerHTML = "🎉 选对啦！真棒！<br><span class='sub-text'>快把手伸向左上角镜头喂它！</span>";
              statusMsg.classList.add('reward-mode');
              isWaitingForReward = true;
              debugText.innerText = "AI 视觉: 等待手掌出现..."; debugText.style.color = "#ffff00";
          })
          // 4. 猫咪复位
          .to(catGroup.rotation, { z: 0, x: 0, duration: 0.5 })
          .to(catGroup.position, { z: 0, duration: 0.5 }, "<");
    }
    // 绑定事件
    document.getElementById('btn-carrot').addEventListener('click', () => handleSelection('carrot'));
    document.getElementById('btn-glasses').addEventListener('click', () => handleSelection('glasses'));
    document.getElementById('btn-bottle').addEventListener('click', () => handleSelection('bottle'));


    // ================= 5. MediaPipe 手势奖励系统 =================
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    function onHandsResults(results) {
        // 绘制调试骨架
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            for (const landmarks of results.multiHandLandmarks) {
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});
            }
            // 核心触发逻辑
            if (isWaitingForReward) triggerReward();
        }
        canvasCtx.restore();
    }

    function triggerReward() {
        isWaitingForReward = false;
        debugText.innerText = "AI 视觉: 奖励触发！"; debugText.style.color = "#00ff00";
        statusMsg.innerHTML = "❤️ 收到奖励啦！好开心！❤️";
        
        // 开心动画
        const tl = gsap.timeline();
        tl.to(catGroup.position, { y: 2.2, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }) // 跳跃
          .to(catGroup.rotation, { z: 0.15, duration: 0.15, yoyo: true, repeat: 5, ease: "linear" }, "-=0.4") // 左右摇摆
          .to(catGroup.rotation, { z: 0, duration: 0.2 }) // 复位
          .call(() => {
              buttons.forEach(b => b.disabled = false); // 解锁
              statusMsg.classList.remove('reward-mode');
              statusMsg.innerHTML = "请选择下一个物品";
              debugText.innerText = "AI 视觉: 待机中..."; debugText.style.color = "#0f0";
          });
    }

    // MediaPipe 初始化
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onHandsResults);

    const cameraMediapipe = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 320, height: 240
    });
    
    cameraMediapipe.start()
        .then(() => { statusMsg.innerHTML = "系统就绪<br><span class='sub-text'>点击下方按钮开始玩耍</span>"; })
        .catch(err => { statusMsg.innerHTML = "⚠️ 摄像头权限不足<br><span class='sub-text'>请允许访问以便互动</span>"; });

    initThreeJS(); // 启动3D世界

</script>
</body>
</html>
